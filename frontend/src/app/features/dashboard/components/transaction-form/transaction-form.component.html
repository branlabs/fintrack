<form class="form-card" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h3>Create transaction</h3>

  <label>
    Category
    <select formControlName="category" [disabled]="disabled || submitLoading">
      <option value="">Select category</option>
      <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
    </select>
  </label>

  <label>
    User
    <select formControlName="user" [disabled]="disabled || submitLoading">
      <option value="">Select user</option>
      <option *ngFor="let user of users" [value]="user.id">{{ user.name }}</option>
    </select>
  </label>

  <label>
    Amount
    <input
      type="number"
      step="0.01"
      min="0.01"
      formControlName="amount"
      [disabled]="disabled || submitLoading"
      placeholder="100000"
    />
  </label>

  <label>
    Date
    <input type="date" formControlName="occurred_on" [disabled]="disabled || submitLoading" />
  </label>

  <label>
    Note
    <input
      type="text"
      formControlName="note"
      [disabled]="disabled || submitLoading"
      placeholder="Optional note"
    />
  </label>

  <p
    class="field-error"
    *ngIf="form.invalid && (form.dirty || form.touched)"
  >
    Please complete all required fields with valid values.
  </p>

  <button type="submit" [disabled]="disabled || submitLoading">
    {{ submitLoading ? 'Saving...' : 'Save transaction' }}
  </button>
</form>
