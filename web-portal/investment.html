<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack - Đầu tư</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- App CSS -->
    <link href="app.css" rel="stylesheet">
</head>

<body>
    <div class="app-root">

        <!-- Header -->
        <header class="app-header">
            <button class="btn btn-sm btn-outline-secondary d-md-none btn-icon me-2" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
                <i class="bi bi-list fs-5"></i>
                <span class="visually-hidden">Mở menu</span>
            </button>
            <div class="app-brand d-flex align-items-center gap-2">
                <img src="{% static 'img/logo.svg' %}" alt="Logo FinTrack" class="brand-logo">
                <h5 class="m-0 fw-bold">FinTrack</h5>
            </div>
            <div class="ms-auto d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary">Đăng nhập</button>
            </div>
        </header>

        <!-- Mobile sidebar -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="mobileSidebarLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <nav class="nav flex-column gap-2 sidebar-nav">
                    <a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                    <a class="nav-link active bg-light" href="/investments/"><i class="bi bi-graph-up"></i> Đầu tư</a>
                    <a class="nav-link" href="#"><i class="bi bi-table"></i> Dữ liệu</a>
                    <a class="nav-link" href="#"><i class="bi bi-gear"></i> Cài đặt</a>
                </nav>
            </div>
        </div>

        <!-- Main -->
        <main class="app-main container-fluid">
            <div class="row h-100 g-0">

                <!-- Sidebar trái -->
                <aside class="col-12 col-md-2 sidebar d-none d-md-block" aria-label="Sidebar">
                    <nav class="nav flex-column gap-2 sidebar-nav">
                        <a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                        <a class="nav-link active bg-light" href="/investments/"><i class="bi bi-graph-up"></i> Đầu
                            tư</a>
                        <a class="nav-link" href="#"><i class="bi bi-table"></i> Dữ liệu</a>
                        <a class="nav-link" href="#"><i class="bi bi-gear"></i> Cài đặt</a>
                    </nav>
                </aside>

                <!-- Nội dung chính -->
                <section class="col-12 col-md-10">
                    <div class="app-scroll">
                        <div class="blank-canvas"></div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2">
                <small class="text-muted">
                    &copy; 2025 BranLabs - Content & source code are open (MIT). Free to use for educational and
                    personal
                    purposes.
                </small>
                <small>
                    <a href="#" class="link-secondary text-decoration-none">Docs</a>
                    <span class="mx-2">•</span>
                    <a href="#" class="link-secondary text-decoration-none">Contribute</a>
                </small>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
