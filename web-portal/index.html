<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- (Tuỳ chọn) Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- App CSS -->
    <link href="app.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
    <div class="app-root">

        <!-- Header -->
        <header class="app-header">
            <h5 class="m-0 fw-bold">FinTrack</h5>
            <div class="ms-auto d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary">Đăng nhập</button>
            </div>
        </header>

        <!-- Main -->
        <main class="app-main container-fluid">
            <div class="row h-100 g-0">

                <!-- Sidebar trái -->
                <aside class="col-12 col-md-2 sidebar">
                    <nav class="nav flex-column gap-2">
                        <a class="nav-link active bg-light" href="#"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                        <a class="nav-link" href="#"><i class="bi bi-graph-up"></i> Phân tích</a>
                        <a class="nav-link" href="#"><i class="bi bi-table"></i> Dữ liệu</a>
                        <a class="nav-link" href="#"><i class="bi bi-gear"></i> Cài đặt</a>
                    </nav>
                </aside>

                <!-- Cột giữa (tổng chi + nút N/T/M) -->
                <section class="col-12 col-md-3">
                    <div class="app-scroll">
                        <div class="card mini-card mb-3 text-center">
                            <div class="card-body">
                                <h6 class="card-title mb-2">Tổng chi</h6>
                                <h3 id="totalAmount" class="fw-bold text-primary mb-0">0₫</h3>
                                <small class="text-muted" id="totalLabel">Hôm nay</small>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <div class="btn-group" role="group" aria-label="Khoảng thời gian">
                                <button id="btnD" class="btn btn-outline-primary btn-sm">N</button>
                                <button id="btnW" class="btn btn-outline-primary btn-sm">T</button>
                                <button id="btnM" class="btn btn-outline-primary btn-sm">M</button>
                            </div>
                            <small class="text-muted">N = Ngày, T = Tuần, M = Tháng</small>
                        </div>
                    </div>
                </section>

                <!-- Cột phải (biểu đồ lớn) -->
                <section class="col-12 col-md-7">
                    <div class="app-scroll">
                        <div class="card big-card">
                            <div class="card-header bg-white">
                                <strong>Biểu đồ chính</strong>
                            </div>
                            <div class="card-body">
                                <div class="chart-wrap">
                                    <canvas id="mainChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2">
                <small class="text-muted">
                    © 2025 BranLabs — Content & source code are open (MIT). Free to use for educational and
                    personal purposes.
                </small>
                <small>
                    <a href="#" class="link-secondary text-decoration-none">Tài liệu</a>
                    <span class="mx-2">•</span>
                    <a href="#" class="link-secondary text-decoration-none">Đóng góp</a>
                </small>
            </div>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Sinh dữ liệu ngẫu nhiên
        function genData(n, amp = 10) {
            const data = [];
            let v = Math.random() * amp;
            for (let i = 0; i < n; i++) {
                v += (Math.random() - 0.5) * (amp * 0.2);
                data.push(Math.max(0, v));
            }
            return data;
        }

        // Biểu đồ chính
        const mainCtx = document.getElementById('mainChart');
        const mainChart = new Chart(mainCtx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, (_, i) => i + 1),
                datasets: [{
                    label: 'Doanh số',
                    data: genData(30, 20),
                    borderWidth: 2,
                    tension: .35,
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false } },
                    y: { grid: { color: 'rgba(0,0,0,.05)' } }
                }
            }
        });

        // Cấu hình các khoảng thời gian
        const ranges = { 'N': 7, 'T': 14, 'M': 30 };

        // Tính tổng chi tiêu
        function calcTotal(rangeKey) {
            const n = ranges[rangeKey] || 30;
            const values = genData(n, 20);
            const total = values.reduce((a, b) => a + b, 0);
            return { total, values };
        }

        // Cập nhật giao diện
        function updateTotal(rangeKey) {
            const { total, values } = calcTotal(rangeKey);
            const elTotal = document.getElementById('totalAmount');
            const elLabel = document.getElementById('totalLabel');

            elTotal.textContent = total.toLocaleString('vi-VN') + '₫';
            elLabel.textContent =
                rangeKey === 'N' ? 'Hôm nay' :
                    rangeKey === 'T' ? 'Tuần này' :
                        'Tháng này';

            // Cập nhật biểu đồ chính
            const n = ranges[rangeKey];
            mainChart.data.labels = Array.from({ length: n }, (_, i) => i + 1);
            mainChart.data.datasets[0].data = values;
            mainChart.update();
        }

        // Nút sự kiện
        document.getElementById('btnD').addEventListener('click', () => updateTotal('N'));
        document.getElementById('btnW').addEventListener('click', () => updateTotal('T'));
        document.getElementById('btnM').addEventListener('click', () => updateTotal('M'));

        // Mặc định: Tháng
        updateTotal('M');
    </script>
</body>

</html>
