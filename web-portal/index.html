<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinTrack</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- (Tuỳ chọn) Bootstrap Icons cho icon sidebar -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Chart.js cho biểu đồ demo -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --header-h: 64px;
        }

        body,
        html {
            height: 100%;
        }

        .app-root {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            height: var(--header-h);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, .075);
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .app-main {
            height: calc(100vh - var(--header-h));
            overflow: hidden;
        }

        .app-scroll {
            height: 100%;
            overflow: auto;
            padding: 1rem;
        }

        .sidebar {
            border-right: 1px solid rgba(0, 0, 0, .075);
            height: 100%;
            padding: 1rem .75rem;
        }

        .sidebar .nav-link {
            border-radius: .5rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .card-stretch {
            height: 100%;
        }

        .mini-card {
            min-height: 180px;
        }

        .big-card {
            min-height: 360px;
        }

        /* đảm bảo canvas co giãn đúng */
        .chart-wrap {
            position: relative;
            height: 100%;
        }

        .chart-wrap canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <div class="app-root">

        <!-- Header -->
        <header class="app-header">
            <h5 class="m-0 fw-bold">FinTrack</h5>
            <div class="ms-auto d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary">Đăng nhập</button>
            </div>
        </header>

        <!-- Main -->
        <div class="app-main container-fluid">
            <div class="row h-100 g-0">

                <!-- Sidebar trái -->
                <aside class="col-12 col-md-2 sidebar">
                    <nav class="nav flex-column gap-2">
                        <a class="nav-link active bg-light" href="#"><i class="bi bi-speedometer2"></i> Tổng quan</a>
                        <a class="nav-link" href="#"><i class="bi bi-graph-up"></i> Phân tích</a>
                        <a class="nav-link" href="#"><i class="bi bi-table"></i> Dữ liệu</a>
                        <a class="nav-link" href="#"><i class="bi bi-gear"></i> Cài đặt</a>
                    </nav>
                </aside>

                <!-- Cột giữa (widget nhỏ + nút T/N/M) -->
                <section class="col-12 col-md-3">
                    <div class="app-scroll">
                        <div class="card mini-card mb-3">
                            <div class="card-body">
                                <h6 class="card-title mb-2">Mini chart</h6>
                                <div class="chart-wrap"><canvas id="miniChart"></canvas></div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <div class="btn-group" role="group" aria-label="Khoảng thời gian">
                                <button id="btnD" class="btn btn-outline-primary btn-sm">N</button>
                                <button id="btnW" class="btn btn-outline-primary btn-sm">T</button>
                                <button id="btnM" class="btn btn-outline-primary btn-sm">M</button>
                            </div>
                            <small class="text-muted">N = Ngày, T = Tuần, M = Tháng</small>
                        </div>
                    </div>
                </section>

                <!-- Cột phải (biểu đồ lớn) -->
                <section class="col-12 col-md-7">
                    <div class="app-scroll">
                        <div class="card big-card card-stretch">
                            <div class="card-header bg-white">
                                <strong>Biểu đồ chính</strong>
                            </div>
                            <div class="card-body">
                                <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Tạo dữ liệu mẫu
        function genData(n, amp = 10) {
            const data = [];
            let v = Math.random() * amp;
            for (let i = 0; i < n; i++) {
                v += (Math.random() - 0.5) * (amp * 0.2);
                data.push(Math.max(0, v));
            }
            return data;
        }

        // Mini chart
        const miniCtx = document.getElementById('miniChart');
        const miniChart = new Chart(miniCtx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 20 }, (_, i) => i + 1),
                datasets: [{
                    data: genData(20, 8),
                    borderWidth: 2,
                    fill: false,
                    tension: .3
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Main chart
        const mainCtx = document.getElementById('mainChart');
        const mainChart = new Chart(mainCtx, {
            type: 'line',
            data: {
                labels: Array.from({ length: 30 }, (_, i) => i + 1),
                datasets: [{
                    label: 'Doanh số',
                    data: genData(30, 20),
                    borderWidth: 2,
                    tension: .35,
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false } },
                    y: { grid: { color: 'rgba(0,0,0,.05)' } }
                }
            }
        });

        // Nút N/T/M để đổi độ dài dữ liệu biểu đồ chính
        const ranges = {
            'N': 7,   // Ngày (7 điểm)
            'T': 14,  // Tuần (14 điểm)
            'M': 30   // Tháng (30 điểm)
        };

        function updateMain(rangeKey) {
            const n = ranges[rangeKey] || 30;
            mainChart.data.labels = Array.from({ length: n }, (_, i) => i + 1);
            mainChart.data.datasets[0].data = genData(n, 20);
            mainChart.update();
        }

        document.getElementById('btnD').addEventListener('click', () => updateMain('N'));
        document.getElementById('btnW').addEventListener('click', () => updateMain('T'));
        document.getElementById('btnM').addEventListener('click', () => updateMain('M'));
    </script>
</body>

</html>
